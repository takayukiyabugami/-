<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="White pawn armored infantry">
  <defs>
    <style>
      .out { stroke: #15130f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .ink { stroke: #2a241c; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .trim { stroke: #8d6a39; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <linearGradient id="wn_metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff9ea"/>
      <stop offset="0.5" stop-color="#d7cdbc"/>
      <stop offset="1" stop-color="#8e8578"/>
    </linearGradient>
    <linearGradient id="wn_cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0eadb"/>
      <stop offset="1" stop-color="#c4b8a6"/>
    </linearGradient>
    <linearGradient id="wn_leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a5736"/>
      <stop offset="1" stop-color="#3a291c"/>
    </linearGradient>
    <linearGradient id="wn_blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fbff"/>
      <stop offset="0.66" stop-color="#9da4a8"/>
      <stop offset="1" stop-color="#32363a"/>
    </linearGradient>
  </defs>

  <g id="shadow">
    <ellipse cx="121" cy="238" rx="70" ry="12" fill="#111" opacity="0.18"/>
  </g>

  <g id="banner">
    <path d="M159 34 H205 L200 48 H164 Z" fill="#6b4a2f" class="out"/>
