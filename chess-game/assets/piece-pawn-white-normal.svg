    <path d="M184 76 L196 112 L184 145 L172 112 Z" fill="#090909" opacity="0.95"/>
    <path d="M174 112 L184 97 L194 112 L184 127 Z" fill="#090909" opacity="0.86"/>
    <path d="M170 154 L179 146 L187 157 L194 147 L201 154 L197 182 L190 172 L184 190 L177 171 L171 181 Z" fill="#d8cfbe" class="out"/>
    <path d="M197 25 L203 35 H191 Z" fill="url(#wn_blade)" class="out"/>
    <path d="M193 221 H201 L197 235 Z" fill="#2a1d14" class="out"/>
  </g>

  <g id="weapon">
