<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Black pawn armored infantry">
  <defs>
    <style>
      .out { stroke: #121212; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .ink { stroke: #171717; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .trim { stroke: #b08b55; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <linearGradient id="bn_metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f7378"/>
      <stop offset="0.48" stop-color="#22262a"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="bn_cloth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202124"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="bn_leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a4b2d"/>
      <stop offset="1" stop-color="#2b1d13"/>
    </linearGradient>
    <linearGradient id="bn_blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2f4"/>
      <stop offset="0.62" stop-color="#7f868c"/>
      <stop offset="1" stop-color="#171a1f"/>
    </linearGradient>
  </defs>

  <g id="shadow">
