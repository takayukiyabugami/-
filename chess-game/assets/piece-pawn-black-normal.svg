    <path d="M82 111 H156 M80 132 H158 M86 153 H151" class="ink"/>
    <path d="M119 93 L132 126 L119 159 L105 126 Z" fill="#f5f0e6" opacity="0.92"/>
    <path d="M105 126 L119 113 L132 126 L119 139 Z" fill="#f5f0e6" opacity="0.7"/>
