    <path d="M184 78 L194 111 L184 144 L174 111 Z" fill="#f2ede1" opacity="0.88"/>
    <path d="M174 111 L184 96 L194 111 L184 126 Z" fill="#f2ede1" opacity="0.72"/>
    <path d="M170 154 L179 146 L187 157 L194 147 L201 154 L197 182 L190 172 L184 190 L177 171 L171 181 Z" fill="#070707" class="out"/>
    <path d="M197 25 L203 35 H191 Z" fill="url(#bn_blade)" class="out"/>
    <path d="M193 221 H201 L197 235 Z" fill="#2a1d14" class="out"/>
  </g>

  <g id="weapon">
